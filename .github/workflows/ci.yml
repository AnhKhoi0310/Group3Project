name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: reviewlens_test
          MYSQL_ROOT_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-only-password --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: mysql+pymysql://root:ci-only-password@127.0.0.1:3306/reviewlens_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Build
        run: python -m compileall -q app
      - name: Unit tests with coverage
        run: pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Check changed-code coverage
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          diff-cover coverage.xml \
            --compare-branch=origin/main \
            --fail-under=80

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Build
        run: npm run build
      - name: Unit tests with coverage
        run: npm run test:coverage

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check frontend changed-code coverage
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install diff-cover==9.6.0
          git fetch origin ${{ github.event.pull_request.base.ref }}
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch=origin/${{ github.event.pull_request.base.ref }} \
            --fail-under=80
